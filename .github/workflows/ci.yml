name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Cancels a still-running CI run for the same branch/PR when new commits
# land, instead of letting a superseded run keep burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Set up test config
        run: cp config/config.example.json config/config.json
        working-directory: server
      - name: Type-check
        # ts-jest only type-checks files actually reached by a test's
        # import graph -- a type error in an untested file can slip
        # through `npm test` alone. This checks the whole project.
        run: npx tsc --noEmit
        working-directory: server
      - name: Lint
        run: npm run lint
        working-directory: server
      - name: Run server test suite
        run: npm test -- --coverage
        working-directory: server
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 14
      - name: Security audit (informational)
        # Non-blocking for now -- there are real pre-existing
        # vulnerabilities (including a critical one in mongoose) that
        # haven't been addressed yet. Reports findings without failing
        # the job; revisit making this blocking once dependencies are
        # brought up to date.
        run: npm audit --audit-level=high || true
        working-directory: server

  client-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: client
      - name: Lint
        run: npm run lint
        working-directory: client
      - name: Security audit (informational)
        run: npm audit --audit-level=high || true
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider

  docker-build:
    # Was gated behind `if: github.event_name == 'push'`, meaning a PR
    # could merge into master without this ever running -- the only
    # thing that actually exercised the client build was this job, and
    # PRs skipped it entirely. Now requires both fast checks first and
    # runs on PRs too, so nothing merges without the full image
    # actually assembling.
    needs: [server-checks, client-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up server config for build
        # tsc's compile-time import of config.json (via resolveJsonModule)
        # needs the file to physically exist in the build context - this
        # job is a separate runner, so it needs its own copy.
        # Placeholder values only; production always gets its real config
        # from wherever the actual Heroku deploy sources it, not this file.
        run: cp server/config/config.example.json server/config/config.json
      - name: Build Docker image
        run: docker compose -f "docker-compose.yml" build
        env:
          PORT: 5002

  # Deploys develop -> the dev Heroku app on every push, no approval
  # gate -- fast feedback, matches a typical "staging auto-deploys"
  # setup. needs: guarantees this only runs after every validation job
  # (including the docker-build smoke test) has already passed for this
  # exact commit -- a separate, independently-triggered workflow would
  # not have that guarantee, and could deploy a commit that was pushed
  # directly to develop without ever going through a PR.
  deploy-dev:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [server-checks, client-checks, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: note-script-dev
    steps:
      - uses: actions/checkout@v5
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Log in to Heroku Container Registry
        # `heroku container:login` has a known, documented bug where it
        # can report "not logged in" even with HEROKU_API_KEY correctly
        # set (heroku/cli#1565) -- this is the exact symptom we hit.
        # Logging in directly via `docker login`, using the credentials
        # Heroku's own docs specify (email as username, API key as
        # password), sidesteps the CLI's login logic entirely.
        # --password-stdin keeps the key out of the process list/shell
        # history.
        run: echo "$HEROKU_API_KEY" | docker login --username="${{ secrets.HEROKU_EMAIL }}" --password-stdin registry.heroku.com
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f server/Dockerfile \
            --build-arg REACT_APP_HOST=development \
            -t registry.heroku.com/$HEROKU_APP_NAME/web \
            .
      - name: Push image to Heroku Container Registry
        run: docker push registry.heroku.com/$HEROKU_APP_NAME/web
      - name: Release
        run: heroku container:release web --app $HEROKU_APP_NAME

  # Deploys master -> the prod Heroku app -- same steps as dev, but
  # referencing the "production" environment pauses this job for
  # required-reviewer approval (configured in repo Settings ->
  # Environments, not in this file) before it runs at all. A human
  # consciously confirms every production release; the build itself is
  # still fully automated.
  deploy-prod:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [server-checks, client-checks, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: note-script
    steps:
      - uses: actions/checkout@v5
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Log in to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login --username="${{ secrets.HEROKU_EMAIL }}" --password-stdin registry.heroku.com
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f server/Dockerfile \
            --build-arg REACT_APP_HOST=production \
            -t registry.heroku.com/$HEROKU_APP_NAME/web \
            .
      - name: Push image to Heroku Container Registry
        run: docker push registry.heroku.com/$HEROKU_APP_NAME/web
      - name: Release
        run: heroku container:release web --app $HEROKU_APP_NAME
