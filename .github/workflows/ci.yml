name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# Cancels a still-running CI run for the same branch/PR when new commits
# land, instead of letting a superseded run keep burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Pin npm version
        run: npm install -g npm@10.9.7
      - name: Install server dependencies
        run: |
          npm --version
          npm ci
        working-directory: server
      - name: Set up test config
        run: cp config/config.example.json config/config.json
        working-directory: server
      - name: Type-check
        # ts-jest only type-checks files actually reached by a test's
        # import graph -- a type error in an untested file can slip
        # through `npm test` alone. This checks the whole project.
        run: npx tsc --noEmit
        working-directory: server
      - name: Lint
        run: npm run lint
        working-directory: server
      - name: Run server test suite
        run: npm test -- --coverage
        working-directory: server
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 14
      - name: Security audit
        # Blocking -- verified directly before making this change that
        # the server is genuinely at 0 vulnerabilities across every
        # severity (the previous "critical in mongoose" this comment
        # used to reference is resolved). This now actually guards
        # against a future dependency reintroducing a real
        # vulnerability, rather than just reporting one that's already
        # known and accepted.
        run: npm audit --audit-level=high
        working-directory: server

  client-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Pin npm version
        # actions/setup-node with only node-version specified installs
        # whatever npm ships bundled with that Node image, which floats
        # independently of Node version and isn't guaranteed to match
        # what's been verified working locally -- pinned to the exact
        # version this lockfile has been tested against.
        run: npm install -g npm@10.9.7
      - name: Install client dependencies
        run: |
          npm --version
          npm ci
        working-directory: client
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: client
      - name: Lint
        run: npm run lint
        working-directory: client
      - name: Run client test suite
        run: CI=true npm test -- --coverage --watchAll=false
        working-directory: client
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage
          retention-days: 14
      - name: Security audit (informational)
        # Non-blocking, deliberately -- reviewed every client-side
        # finding directly (not just the count): the vast majority are
        # build-time/test-time-only tooling (Jest, webpack loaders,
        # SVG/CSS processors) that never ships to a real user's
        # browser, and the couple of genuine runtime-code findings
        # (react-router) aren't actually reachable given how routing
        # is used in this app (no user-input-driven navigation). Making
        # this blocking would fail CI on findings that carry no real
        # risk here; revisit if react-router's major-version upgrade
        # (a deliberate, separate migration) ever happens.
        run: npm audit --audit-level=high || true
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider

  docker-build:
    # Was gated behind `if: github.event_name == 'push'`, meaning a PR
    # could merge into master without this ever running -- the only
    # thing that actually exercised the client build was this job, and
    # PRs skipped it entirely. Now requires both fast checks first and
    # runs on PRs too, so nothing merges without the full image
    # actually assembling.
    needs: [server-checks, client-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # A real, ephemeral MongoDB -- server.ts's own startup sequence
      # requires a successful DB connection before it ever calls
      # app.listen(), so a genuine "did the container actually boot"
      # smoke test needs a real, reachable database, not just an image
      # that assembles successfully.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        # Builds the SAME Dockerfile/path deploy-dev and deploy-prod
        # actually use (previously this job used `docker compose build`
        # instead, a separate build definition that could silently
        # drift from what actually ships -- passing this smoke test
        # never actually proved the deployed artifact itself was
        # sound). GitHub Actions cache (type=gha) persists layers
        # between runs, so unchanged layers (base image, npm install
        # when package.json hasn't changed) are reused instead of
        # rebuilt from scratch every single run. load:true makes the
        # built image available to `docker run` below on this same
        # runner, rather than pushing it anywhere.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: |
            REACT_APP_HOST=development
          tags: note-script-smoketest:latest
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the container and verify it actually serves a request
        # --network=host: shares the runner's own network namespace
        # directly, so the container can reach the mongodb service
        # container at localhost:27017 with no extra DNS setup --
        # simplest, most reliable option on a Linux runner.
        # AUTH0_DOMAIN/AUTH0_AUDIENCE just need to be non-empty strings
        # for the server to start at all (checkJwt.ts only validates
        # they're present at startup) -- /health itself needs no auth
        # at all, so these never actually get exercised by this
        # specific check, just needed for the app to boot without
        # throwing on missing config.
        run: |
          docker run -d --name smoketest --network=host \
            -e NODE_ENV=production \
            -e MONGODB_URI=mongodb://localhost:27017/smoketest \
            -e AUTH0_DOMAIN=smoketest.invalid \
            -e AUTH0_AUDIENCE=https://smoketest.invalid \
            note-script-smoketest:latest

          echo "Waiting for the server to come up..."
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "Server is up, and reports a healthy database connection."
              exit 0
            fi
            echo "Attempt $i: got status $status, retrying..."
            sleep 2
          done

          echo "Server never came up correctly -- dumping container logs for debugging:"
          docker logs smoketest
          exit 1
      - name: Clean up
        if: always()
        run: docker rm -f smoketest || true

  # Deploys develop -> the dev Heroku app on every push, no approval
  # gate -- fast feedback, matches a typical "staging auto-deploys"
  # setup. needs: guarantees this only runs after every validation job
  # (including the docker-build smoke test) has already passed for this
  # exact commit -- a separate, independently-triggered workflow would
  # not have that guarantee, and could deploy a commit that was pushed
  # directly to develop without ever going through a PR.
  deploy-dev:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [server-checks, client-checks, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: note-script-dev
    steps:
      - uses: actions/checkout@v7
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Log in to Heroku Container Registry
        # `heroku container:login` has a known, documented bug where it
        # can report "not logged in" even with HEROKU_API_KEY correctly
        # set (heroku/cli#1565) -- this is the exact symptom we hit.
        # Logging in directly via `docker login`, using the credentials
        # Heroku's own docs specify (email as username, API key as
        # password), sidesteps the CLI's login logic entirely.
        # --password-stdin keeps the key out of the process list/shell
        # history.
        run: echo "$HEROKU_API_KEY" | docker login --username="${{ secrets.HEROKU_EMAIL }}" --password-stdin registry.heroku.com
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: |
            REACT_APP_HOST=development
          tags: registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          push: true
          # Heroku's Container Registry doesn't support the OCI image-
          # index/attestation-manifest format buildx attaches by
          # default since a recent BuildKit version -- a known
          # incompatibility with several registries (Azure Container
          # Registry hits the identical issue), not specific to this
          # app. Without these, the push fails with "unsupported".
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release
        run: heroku container:release web --app $HEROKU_APP_NAME

  # Deploys to the prod Heroku app -- but only when someone manually
  # triggers this workflow from the Actions tab (Run workflow -> pick
  # "master"), never automatically on push. GitHub's environment
  # required-reviewer protection rule (pause-then-approve) needs
  # GitHub Pro/Team for a private repo, which this isn't on -- this is
  # the free equivalent: a human has to deliberately choose to run
  # this, there's no "it happens automatically unless someone
  # objects" path at all. Guards the ref too, so selecting a
  # non-master branch in the manual-run dropdown can't accidentally
  # deploy it to prod. `environment: production` no longer gates
  # anything here, but it's kept for the deployment-history tracking
  # GitHub shows in the repo's Environments sidebar.
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: [server-checks, client-checks, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: note-script
    steps:
      - uses: actions/checkout@v7
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Log in to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login --username="${{ secrets.HEROKU_EMAIL }}" --password-stdin registry.heroku.com
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: |
            REACT_APP_HOST=production
            REACT_APP_GA_MEASUREMENT_ID=G-Y08MF6RWVK
          tags: registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          push: true
          # See deploy-dev's identical comment above -- Heroku's
          # Container Registry doesn't support buildx's default
          # attestation-manifest format.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release
        run: heroku container:release web --app $HEROKU_APP_NAME
