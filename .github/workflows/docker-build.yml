name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Cancels a still-running CI run for the same branch/PR when new commits
# land, instead of letting a superseded run keep burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Set up test config
        run: cp config/config.example.json config/config.json
        working-directory: server
      - name: Type-check
        # ts-jest only type-checks files actually reached by a test's
        # import graph -- a type error in an untested file can slip
        # through `npm test` alone. This checks the whole project.
        run: npx tsc --noEmit
        working-directory: server
      - name: Run server test suite
        run: npm test
        working-directory: server

  client-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider

  docker-build:
    # Was gated behind `if: github.event_name == 'push'`, meaning a PR
    # could merge into master without this ever running -- the only
    # thing that actually exercised the client build was this job, and
    # PRs skipped it entirely. Now requires both fast checks first and
    # runs on PRs too, so nothing merges without the full image
    # actually assembling.
    needs: [server-checks, client-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up server config for build
        # tsc's compile-time import of config.json (via resolveJsonModule)
        # needs the file to physically exist in the build context - this
        # job is a separate runner, so it needs its own copy.
        # Placeholder values only; production always gets its real config
        # from wherever the actual Heroku deploy sources it, not this file.
        run: cp server/config/config.example.json server/config/config.json
      - name: Build Docker image
        run: docker compose -f "docker-compose.yml" build
        env:
          PORT: 5002
